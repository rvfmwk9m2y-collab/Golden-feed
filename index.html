<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Feed</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#fbf6ee;color:#3a2d1a}
  header{padding:16px;text-align:center}
  button{font-size:18px;padding:12px 20px;border:0;border-radius:12px;background:#e0a83d;color:#fff}
  .grid{display:grid;gap:14px;padding:14px;grid-template-columns:1fr}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .card iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
  .card h3{font-size:15px;margin:10px}
</style>
</head>
<body>
<header>
  <h1>🐾 Golden Feed</h1>
  <button id="go">Fetch golden retriever videos</button>
</header>
<div id="results" class="grid"></div>
<script>
const API_KEY = "YOUR_REFERRER_RESTRICTED_KEY";   // restricted to your github.io domain
const QUERY = "golden retriever";

async function search(){
  const url = "https://www.googleapis.com/youtube/v3/search"
    + "?part=snippet&type=video&maxResults=24&order=date"
    + "&videoEmbeddable=true&safeSearch=moderate"
    + "&q=" + encodeURIComponent(QUERY)
    + "&key=" + API_KEY;
  const box = document.getElementById("results");
  box.innerHTML = "Loading…";
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    box.innerHTML = "";
    (data.items||[]).forEach(it=>{
      const id = it.id.videoId; if(!id) return;
      const c = document.createElement("div"); c.className="card";
      c.innerHTML = '<iframe src="https://www.youtube.com/embed/'+id+'" '
        + 'allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" '
        + 'allowfullscreen loading="lazy"></iframe>'
        + '<h3>'+ it.snippet.title.replace(/</g,"&lt;") +'</h3>';
      box.appendChild(c);
    });
    if(!box.children.length) box.textContent = "No videos found.";
  }catch(e){
    box.textContent = "Error: " + e.message;
  }
}
document.getElementById("go").addEventListener("click", search);
search();
</script>
</body>
</html>
